---
# MilesWeb (cPanel) deployment for shaikhismail.com
# Publishes ONLY the site/ folder. README.md, resume/ sources and .git stay private.
# Before the first deploy: replace CPANEL_USERNAME below with your cPanel username.
deployment:
  tasks:
    - export DEPLOYPATH=/home/CPANEL_USERNAME/public_html/
    - /bin/cp -R site/. $DEPLOYPATH
